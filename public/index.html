<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Greg Zirra's Calculator | MODULO Feature</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background bubbles */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }

        .calculator-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.2);
            padding: 32px;
            width: 100%;
            max-width: 500px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .calculator-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.3);
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 0.85rem;
            color: #6c757d;
            font-weight: 500;
        }

        .unique-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 40px;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.3);
        }

        .unique-badge i {
            font-size: 0.9rem;
        }

        /* Display Section */
        .display-container {
            background: #f8f9fa;
            border-radius: 32px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.05), 0 1px 0 rgba(255, 255, 255, 0.8);
            position: relative;
        }

        #result {
            font-size: 3rem;
            font-weight: 600;
            background: transparent;
            border: none;
            text-align: right;
            width: 100%;
            color: #2d3748;
            font-family: 'Inter', monospace;
            letter-spacing: 1px;
        }

        #result:focus {
            outline: none;
        }

        /* Small label above display */
        .display-label {
            position: absolute;
            top: 12px;
            left: 25px;
            font-size: 0.7rem;
            color: #a0aec0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Button Grid */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .btn {
            padding: 18px 12px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 24px;
            transition: all 0.2s ease;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }

        .btn:active::before {
            width: 120%;
            height: 120%;
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* Number buttons */
        .btn-number {
            background: white;
            color: #2d3748;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .btn-number:hover {
            background: #edf2f7;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        /* Operator buttons */
        .btn-operator {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-operator:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        /* Equals button - special */
        .btn-equals {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.3);
            grid-column: span 1;
        }

        .btn-equals:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(72, 187, 120, 0.4);
        }

        /* Clear button */
        .btn-clear {
            background: #fef5f5;
            color: #fc8181;
            border: 1px solid #fed7d7;
        }

        .btn-clear:hover {
            background: #fed7d7;
            transform: translateY(-2px);
        }

        /* Backspace button */
        .btn-backspace {
            background: #fffaf0;
            color: #ed8936;
            border: 1px solid #feebc8;
        }

        .btn-backspace:hover {
            background: #feebc8;
            transform: translateY(-2px);
        }

        /* MODULO button - highlight unique feature */
        .btn-modulo {
            background: linear-gradient(135deg, #f6ad55 0%, #ed8936 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(246, 173, 85, 0.3);
            position: relative;
        }

        .btn-modulo::after {
            content: '✨';
            position: absolute;
            top: -8px;
            right: -8px;
            font-size: 14px;
            background: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-modulo:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(246, 173, 85, 0.5);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.7rem;
            color: #a0aec0;
        }

        .footer i {
            color: #fc8181;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .calculator-card {
                padding: 20px;
            }
            .btn {
                padding: 14px 10px;
                font-size: 1rem;
            }
            #result {
                font-size: 2.2rem;
            }
            .header h1 {
                font-size: 1.4rem;
            }
        }

        /* Animation for equals */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.98); }
        }

        .btn-equals:active {
            animation: pulse 0.2s ease;
        }
    </style>
</head>
<body>
    <div class="calculator-card">
        <!-- Header with Name and Unique Feature -->
        <div class="header">
            <h1>Greg Tizhe Zirra</h1>
            <p>Software Engineering · SEN 482</p>
            <div class="unique-badge">
                <i class="fas fa-star"></i>
                <span>UNIQUE FEATURE: MODULO OPERATOR (%)</span>
                <i class="fas fa-calculator"></i>
            </div>
        </div>

        <!-- Display -->
        <div class="display-container">
            <div class="display-label">CALCULATION</div>
            <input type="text" id="result" value="0" readonly>
        </div>

        <!-- Button Grid -->
        <div class="btn-grid">
            <button class="btn btn-clear" onclick="clearDisplay()">
                <i class="fas fa-trash-alt"></i> AC
            </button>
            <button class="btn btn-backspace" onclick="backspace()">
                <i class="fas fa-backspace"></i> ⌫
            </button>
            <button class="btn btn-operator" onclick="setOperator('/')">
                <i class="fas fa-divide"></i>
            </button>
            <button class="btn btn-operator" onclick="setOperator('*')">
                <i class="fas fa-times"></i>
            </button>

            <button class="btn btn-number" onclick="appendNumber(7)">7</button>
            <button class="btn btn-number" onclick="appendNumber(8)">8</button>
            <button class="btn btn-number" onclick="appendNumber(9)">9</button>
            <button class="btn btn-operator" onclick="setOperator('-')">
                <i class="fas fa-minus"></i>
            </button>

            <button class="btn btn-number" onclick="appendNumber(4)">4</button>
            <button class="btn btn-number" onclick="appendNumber(5)">5</button>
            <button class="btn btn-number" onclick="appendNumber(6)">6</button>
            <button class="btn btn-operator" onclick="setOperator('+')">
                <i class="fas fa-plus"></i>
            </button>

            <button class="btn btn-number" onclick="appendNumber(1)">1</button>
            <button class="btn btn-number" onclick="appendNumber(2)">2</button>
            <button class="btn btn-number" onclick="appendNumber(3)">3</button>
            <button class="btn btn-modulo" onclick="setOperator('%')">
                <i class="fas fa-percent"></i> MOD
            </button>

            <button class="btn btn-number" onclick="appendNumber(0)">0</button>
            <button class="btn btn-number" onclick="appendDecimal()">
                <i class="fas fa-stop"></i> .
            </button>
            <button class="btn btn-equals" onclick="calculate()">
                <i class="fas fa-equals"></i> =
            </button>
        </div>

        <!-- Footer -->
        <div class="footer">
            <i class="fas fa-heart"></i> MODULO Operator — My Unique Feature <i class="fas fa-star"></i><br>
            <small>© 2026 Greg Tizhe Zirra | CI/CD Pipeline | Docker | GitHub Actions</small>
        </div>
    </div>

    <script>
        // Calculator Logic
        let currentValue = '';
        let previousValue = '';
        let operator = null;
        let waitingForOperand = false;
        
        function updateDisplay() {
            const display = document.getElementById('result');
            if (display) {
                if (currentValue === '') {
                    display.value = '0';
                } else {
                    display.value = currentValue;
                }
            }
        }
        
        function appendNumber(num) {
            if (waitingForOperand) {
                currentValue = '';
                waitingForOperand = false;
            }
            currentValue += num.toString();
            updateDisplay();
        }
        
        function appendDecimal() {
            if (waitingForOperand) {
                currentValue = '0';
                waitingForOperand = false;
            }
            if (!currentValue.includes('.')) {
                currentValue += '.';
            }
            updateDisplay();
        }
        
        function setOperator(op) {
            if (currentValue === '' && previousValue === '') {
                return;
            }
            
            if (previousValue !== '' && currentValue !== '') {
                calculate();
            }
            
            operator = op;
            previousValue = currentValue;
            waitingForOperand = true;
            updateDisplay();
        }
        
        function calculate() {
            if (operator === null || currentValue === '' || previousValue === '') {
                return;
            }
            
            const prev = parseFloat(previousValue);
            const current = parseFloat(currentValue);
            let result = 0;
            
            switch (operator) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '*':
                    result = prev * current;
                    break;
                case '/':
                    if (current === 0) {
                        clearDisplay();
                        document.getElementById('result').value = 'Error: Division by zero';
                        return;
                    }
                    result = prev / current;
                    break;
                case '%':
                    // MODULO - Greg's Unique Feature!
                    if (current === 0) {
                        clearDisplay();
                        document.getElementById('result').value = 'Error: Modulo by zero';
                        return;
                    }
                    result = prev % current;
                    break;
                default:
                    return;
            }
            
            result = parseFloat(result.toFixed(10));
            currentValue = result.toString();
            previousValue = '';
            operator = null;
            waitingForOperand = true;
            updateDisplay();
            
            // Add a little visual feedback for modulo calculations
            if (operator === '%') {
                const display = document.getElementById('result');
                display.style.transform = 'scale(1.02)';
                setTimeout(() => { display.style.transform = 'scale(1)'; }, 200);
            }
        }
        
        function clearDisplay() {
            currentValue = '';
            previousValue = '';
            operator = null;
            waitingForOperand = false;
            updateDisplay();
        }
        
        function backspace() {
            if (currentValue.length > 0) {
                currentValue = currentValue.slice(0, -1);
                if (currentValue === '') {
                    currentValue = '0';
                    waitingForOperand = false;
                }
                updateDisplay();
            }
        }
        
        // Initialize
        updateDisplay();
    </script>
</body>
</html>
