<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greg Tizhe Zirra's Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .calculator-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 20px;
        }
        .display-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: right;
        }
        #result {
            font-size: 2.5rem;
            font-weight: bold;
            background: transparent;
            border: none;
            text-align: right;
            width: 100%;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .btn {
            padding: 15px;
            font-size: 1.2rem;
            font-weight: 600;
        }
        .btn-operator {
            background-color: #667eea;
            color: white;
        }
        .btn-operator:hover {
            background-color: #5a67d8;
            color: white;
        }
        .btn-equals {
            background-color: #48bb78;
            color: white;
        }
        .btn-equals:hover {
            background-color: #38a169;
            color: white;
        }
        .btn-clear {
            background-color: #f56565;
            color: white;
        }
        .btn-clear:hover {
            background-color: #e53e3e;
            color: white;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            color: #2d3748;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .unique-badge {
            background: #48bb78;
            color: white;
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 20px;
            display: inline-block;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="calculator-card">
                    <div class="header">
                        <h2>Greg Tizhe Zirra's Calculator</h2>
                        <span class="unique-badge">✨ MODULO FEATURE ✨</span>
                    </div>
                    
                    <div class="display-container">
                        <input type="text" id="result" value="0" readonly>
                    </div>
                    
                    <div class="btn-grid">
                        <!-- Row 1 -->
                        <button class="btn btn-light" onclick="appendNumber(7)">7</button>
                        <button class="btn btn-light" onclick="appendNumber(8)">8</button>
                        <button class="btn btn-light" onclick="appendNumber(9)">9</button>
                        <button class="btn btn-operator" onclick="setOperator('/')">÷</button>
                        
                        <!-- Row 2 -->
                        <button class="btn btn-light" onclick="appendNumber(4)">4</button>
                        <button class="btn btn-light" onclick="appendNumber(5)">5</button>
                        <button class="btn btn-light" onclick="appendNumber(6)">6</button>
                        <button class="btn btn-operator" onclick="setOperator('*')">×</button>
                        
                        <!-- Row 3 -->
                        <button class="btn btn-light" onclick="appendNumber(1)">1</button>
                        <button class="btn btn-light" onclick="appendNumber(2)">2</button>
                        <button class="btn btn-light" onclick="appendNumber(3)">3</button>
                        <button class="btn btn-operator" onclick="setOperator('-')">−</button>
                        
                        <!-- Row 4 -->
                        <button class="btn btn-light" onclick="appendNumber(0)">0</button>
                        <button class="btn btn-light" onclick="appendDecimal()">.</button>
                        <button class="btn btn-operator" onclick="setOperator('%')">%</button>
                        <button class="btn btn-operator" onclick="setOperator('+')">+</button>
                        
                        <!-- Row 5 -->
                        <button class="btn btn-clear" onclick="clearDisplay()">AC</button>
                        <button class="btn btn-warning" onclick="backspace()">⌫</button>
                        <button class="btn btn-equals" onclick="calculate()">=</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="calculator-app.js"></script>
</body>
</html>
