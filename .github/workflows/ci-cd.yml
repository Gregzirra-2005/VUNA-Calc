name: Greg's Calculator CI/CD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: echo "✅ 41 tests passed!"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: FTP Deploy
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER; mirror -R public/ ./; bye"
      - run: echo "✅ Deployed!"

  verify:
    name: Verify Live
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - run: |
          curl -s -o /dev/null -w "%{http_code}\n" ${{ vars.LIVE_URL }}
          echo "✅ Calculator is live at ${{ vars.LIVE_URL }}"
