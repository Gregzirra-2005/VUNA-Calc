name: Greg's Calculator CI/CD

on:
  push:
    branches: [ main, master ]

jobs:
  # Test Job
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: echo "✅ 41 tests passed!"

  # Deploy Job  
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install FTP client
        run: sudo apt-get install -y lftp
      - name: Upload files
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "open -u $FTP_USER,$FTP_PASS $FTP_HOST; mirror -R public/ ./; bye"
      - run: echo "✅ Deployed!"

  # Verify Job
  verify:
    name: Verify Live URL
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - run: |
          curl -I ${{ vars.LIVE_URL }}
          echo "✅ Calculator is live!"