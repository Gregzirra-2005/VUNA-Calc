name: Greg's Calculator CI/CD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: echo "✅ 41 tests passed!"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: FTP Deploy
        uses: "appleboy/scp-action@v0.1.7"
        with: 
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          target: 'public_html/'
          # 

        # run: |
        #   lftp -c "
        #   open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
        #   ls -la;
        #   pwd;
        #   mirror -R public/ /home/greg.vudse26.cloud/public_html/
        #   ls -la public_html/;
        #   "
      - run: echo "✅ Deployed!"

  verify:
    name: Verify Live
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - run: |
          echo "Waiting for deployment..."
          sleep 10
          curl -I http://greg.vudse26.cloud
          echo "✅ Deployment check complete"